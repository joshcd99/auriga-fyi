  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/auriga.css" />
  <style>
    /* Landing-only chrome: starfield canvas + Auriga constellation SVG +
       corner label. The terminal element itself comes from terminal.js. */
    html, body { width: 100%; min-height: 100%; }
    body { overflow-x: hidden; }

    #stars-canvas { position: fixed; inset: 0; z-index: 0; }

    #constellation {
      position: fixed;
      top: 28px; left: 28px;
      width: min(420px, 38vw);
      height: auto;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: auto;
    }
    #constellation.visible { opacity: 1; }

    #auriga-label {
      position: fixed;
      bottom: 18px; right: 22px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(140, 190, 255, 0.22);
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      animation: aurigaLabelFade 1s ease 3.5s forwards;
    }
    @keyframes aurigaLabelFade { to { opacity: 1; } }
  </style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<svg id="constellation" viewBox="0 0 420 490" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="auriga-label">Auriga · The Charioteer</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="/assets/auriga.js"></script>
<script src="/assets/terminal.js"></script>
<script>
window.addEventListener('load', function () {

  /* ── CONSTELLATION via D3 geoStereographic ──
     α Capella, β Menkalinan, θ Mahasim, β Tau ElNath, ι Hassaleh, ε Almaaz
     centered on Auriga (RA 82.5° Dec 37°), reflected for celestial east→left. */
  const W = 420;
  const starData = [
    { id: 'capella',    name: 'α · Capella',     ra: 79.17, dec: 46.00, r: 6   },
    { id: 'menkalinan', name: 'β · Menkalinan',  ra: 89.88, dec: 44.95, r: 3.5 },
    { id: 'theta',      name: 'θ · Mahasim',     ra: 89.93, dec: 37.21, r: 3   },
    { id: 'elnath',     name: 'β Tau · El Nath', ra: 81.58, dec: 28.61, r: 3.5 },
    { id: 'iota',       name: 'ι · Hassaleh',    ra: 74.24, dec: 33.17, r: 3   },
    { id: 'epsilon',    name: 'ε · Almaaz',      ra: 75.50, dec: 43.82, r: 2.5 },
  ];
  const pentagon = ['capella', 'menkalinan', 'theta', 'elnath', 'iota', 'capella'];

  const projection = d3.geoStereographic()
    .rotate([-82.5, -37, 0])
    .reflectX(true)
    .scale(1500)
    .translate([210, 255]);

  const byId = {};
  starData.forEach(s => {
    const [x, y] = projection([s.ra, s.dec]);
    s.x = x; s.y = y;
    byId[s.id] = s;
  });

  const svg = d3.select('#constellation');
  const tipG = svg.append('g').attr('pointer-events', 'none').style('opacity', 0);
  const tipBg = tipG.append('rect').attr('fill', 'rgba(5,8,15,0.82)').attr('rx', 3).attr('ry', 3);
  const tipTxt = tipG.append('text')
    .attr('font-family', "'Share Tech Mono', monospace")
    .attr('font-size', 11)
    .attr('fill', 'rgba(220,235,255,0.95)');

  function showTooltip(s) {
    tipTxt.text(s.name);
    const bbox = tipTxt.node().getBBox();
    const pad = 5;
    const bw = bbox.width + pad * 2;
    const bh = bbox.height + pad;
    const tx = s.x + 12 + bw > W ? s.x - 14 - bw : s.x + 12;
    const ty = s.y - bh / 2;
    tipBg.attr('x', tx).attr('y', ty).attr('width', bw).attr('height', bh);
    tipTxt.attr('x', tx + pad).attr('y', ty + bbox.height - 1);
    tipG.style('opacity', 1);
  }
  function hideTooltip() { tipG.style('opacity', 0); }

  // Pentagon edges (drawn line by line as the animation runs).
  const lineEls = {};
  for (let i = 0; i < pentagon.length - 1; i++) {
    const a = byId[pentagon[i]];
    const b = byId[pentagon[i + 1]];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    lineEls[`${pentagon[i]}-${pentagon[i+1]}`] = svg.insert('line', ':first-child')
      .attr('x1', a.x).attr('y1', a.y)
      .attr('x2', b.x).attr('y2', b.y)
      .attr('stroke', 'rgba(110,165,255,0.65)')
      .attr('stroke-width', 1.5)
      .attr('stroke-linecap', 'round')
      .attr('stroke-dasharray', len)
      .attr('stroke-dashoffset', len);
  }

  // Stars + hover hit areas.
  starData.forEach(s => {
    const g = svg.append('g').attr('cursor', 'default');
    g.append('circle')
      .attr('cx', s.x).attr('cy', s.y).attr('r', 18)
      .attr('fill', 'transparent').attr('pointer-events', 'all');
    g.append('circle')
      .attr('id', `star-${s.id}`)
      .attr('cx', s.x).attr('cy', s.y).attr('r', s.r)
      .attr('fill', 'rgba(220,235,255,0.95)')
      .style('filter', 'drop-shadow(0 0 5px rgba(170,210,255,0.9))')
      .style('opacity', 0);
    g.on('mouseenter', () => {
      d3.select(`#star-${s.id}`).style('filter', 'drop-shadow(0 0 10px rgba(200,230,255,1))');
      showTooltip(s);
      tipG.raise();
    });
    g.on('mouseleave', () => {
      d3.select(`#star-${s.id}`).style('filter', 'drop-shadow(0 0 5px rgba(170,210,255,0.9))');
      hideTooltip();
    });
  });

  function animateLine(fromId, toId, delay) {
    return new Promise(resolve => {
      setTimeout(() => {
        lineEls[`${fromId}-${toId}`].transition().duration(450).ease(d3.easeLinear)
          .attr('stroke-dashoffset', 0).on('end', resolve);
      }, delay);
    });
  }
  function popStar(id, delay) {
    if (!id || !byId[id]) return;
    setTimeout(() => {
      d3.select(`#star-${id}`).style('opacity', 1)
        .attr('r', byId[id].r * 1.5)
        .transition().duration(200).ease(d3.easeBounceOut)
        .attr('r', byId[id].r);
    }, delay);
  }

  (async function runConstellation() {
    await new Promise(r => setTimeout(r, 500));
    document.getElementById('constellation').classList.add('visible');
    popStar('capella', 200);
    const seq = [
      ['capella',    'menkalinan', 400],
      ['menkalinan', 'theta',      900],
      ['theta',      'elnath',     1350],
      ['elnath',     'iota',       1800],
      ['iota',       'capella',    2200],
    ];
    for (const [from, to, delay] of seq) {
      animateLine(from, to, delay);
      setTimeout(() => { if (to !== 'capella') popStar(to, 0); }, delay + 460);
    }
    setTimeout(() => popStar('epsilon', 0), 2800);
  })();

  /* ── TERMINAL ──
     One DOM element across the entire visit. On first visit, mount it in
     centered mode and run the intro animation inside it; on first command,
     it morphs to the bottom-docked state via CSS transitions (handled by
     terminal.js). On subsequent visits (intro already shown), mount it
     directly in docked mode. */
  const introDone = window.AurigaTerminal && window.AurigaTerminal.wasIntroDone();
  window.AurigaTerminal.mountDock({
    centered: !introDone,
    intro:    !introDone,
    autoFocus: true,
  });

  // Hard reloads on bf-cache restore — keep the current behaviour.
  window.addEventListener('pageshow', e => { if (e.persisted) window.location.reload(); });
});
</script>

</body>
</html>
